<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
  
  <!-- connencting to the css files-->
   <link rel="stylesheet" href="../css/password.css"> 

</head>
<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="resetForm">
            <div class="field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="field">
                <label for="newPassword">New password</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required minlength="8">
            </div>
            <div class="field">
                <label for="confirmPassword">Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required minlength="8">
            </div>
            <button type="submit" class="button">Reset Password</button>
            <div id="message" class="message" aria-live="polite"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('resetForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            message.textContent = '';
            message.classList.remove('success');

            const email = document.getElementById('email').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!email) {
                message.textContent = 'Please enter your email address.';
                return;
            }

            if (newPassword.length < 8) {
                message.textContent = 'Password must be at least 8 characters long.';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.textContent = 'Passwords do not match.';
                return;
            }

            message.textContent = 'Your password has been reset successfully.';
            message.classList.add('success');

            form.reset();
        });
    </script>
</body>
</html>
